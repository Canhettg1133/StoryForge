<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
      margin: 0;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 16px;
      font-weight: 800;
      background: linear-gradient(to right, #818cf8, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-title {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: bold;
    }
    .status-value {
      font-size: 20px;
      font-weight: bold;
      color: #22d3ee;
      margin: 4px 0;
    }
    .status-desc {
      font-size: 11px;
      color: #64748b;
    }
    .btn {
      width: 100%;
      background: #4f46e5;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #4338ca;
    }
    .btn-danger {
      background: #b91c1c;
    }
    .btn-danger:hover {
      background: #991b1b;
    }
    .footer {
      font-size: 10px;
      color: #475569;
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">TravelLead Auto Sender</div>
  </div>

  <div class="status-card">
    <div class="status-title">Trạng thái gửi tin</div>
    <div id="status-val" class="status-value">Đang chờ lệnh...</div>
    <div id="status-desc" class="status-desc">Hãy bắt đầu chiến dịch trên trang Web Dashboard.</div>
  </div>

  <button id="action-btn" class="btn" style="display: none;">Dừng chiến dịch</button>

  <div class="footer">
    Bản quyền © TravelLead Connect v1.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
