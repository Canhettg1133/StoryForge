name = "storyforge-web"
main = "worker/index.js"
compatibility_date = "2026-07-16"
workers_dev = true
preview_urls = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*"]

[[ratelimits]]
name = "SUPREME_EDGE_RATE_LIMITER"
namespace_id = "3101"

  [ratelimits.simple]
  limit = 180
  period = 60

[[ratelimits]]
name = "SUPREME_CHAT_RATE_LIMITER"
namespace_id = "3102"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "SUPREME_CHUNK_RATE_LIMITER"
namespace_id = "3103"

  [ratelimits.simple]
  limit = 120
  period = 60

[vars]
SUPABASE_URL = "https://mjeuajnswqyuerztsncz.supabase.co"
SUPREME_PROMPT_ACTIVE_KEY_VERSION = "2"
DEPLOYMENT_MODE = "production"
ACCESS_CACHE_ENABLED = "true"
OPENAI_PROXY_MAX_BODY_BYTES = "4194304"
OPENAI_PROXY_RATE_LIMIT_MAX = "120"
OPENAI_PROXY_RATE_LIMIT_WINDOW_MS = "60000"
OPENAI_PROXY_BATCH_CONCURRENCY = "6"
CLOUDFLARE_WORKERS_AI_MAX_BODY_BYTES = "6291456"
CLOUDFLARE_WORKERS_AI_RATE_LIMIT_MAX = "40"
CLOUDFLARE_WORKERS_AI_RATE_LIMIT_WINDOW_MS = "60000"
USAGE_LOGGING_ENABLED = "true"
USAGE_LOGGING_TIMEOUT_MS = "2000"

[env.preview]
name = "storyforge"

[[env.preview.ratelimits]]
name = "SUPREME_EDGE_RATE_LIMITER"
namespace_id = "3201"

  [env.preview.ratelimits.simple]
  limit = 180
  period = 60

[[env.preview.ratelimits]]
name = "SUPREME_CHAT_RATE_LIMITER"
namespace_id = "3202"

  [env.preview.ratelimits.simple]
  limit = 30
  period = 60

[[env.preview.ratelimits]]
name = "SUPREME_CHUNK_RATE_LIMITER"
namespace_id = "3203"

  [env.preview.ratelimits.simple]
  limit = 120
  period = 60

[env.preview.vars]
SUPABASE_URL = "https://mjeuajnswqyuerztsncz.supabase.co"
SUPREME_PROMPT_ACTIVE_KEY_VERSION = "2"
DEPLOYMENT_MODE = "production"
ACCESS_CACHE_ENABLED = "true"
OPENAI_PROXY_MAX_BODY_BYTES = "4194304"
OPENAI_PROXY_RATE_LIMIT_MAX = "120"
OPENAI_PROXY_RATE_LIMIT_WINDOW_MS = "60000"
OPENAI_PROXY_BATCH_CONCURRENCY = "6"
CLOUDFLARE_WORKERS_AI_MAX_BODY_BYTES = "6291456"
CLOUDFLARE_WORKERS_AI_RATE_LIMIT_MAX = "40"
CLOUDFLARE_WORKERS_AI_RATE_LIMIT_WINDOW_MS = "60000"
USAGE_LOGGING_ENABLED = "true"
USAGE_LOGGING_TIMEOUT_MS = "2000"
